[phases.setup]
nixPkgs = ["nodejs_20"]

# Force devDependencies even when Railway sets NODE_ENV=production, otherwise
# npm omits them and the `nest` CLI (a devDependency) is missing at build time.
[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

# Migrations run in Railway's preDeployCommand (see railway.json), NOT here —
# so ordinary container restarts / wakes boot straight into the app instead of
# re-running the TypeORM CLI against the DB every time.
[start]
cmd = "npm run start:prod"
